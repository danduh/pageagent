name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes the axe accessibility assertion on the side panel — a serious/critical
      # violation fails this step (the a11y gate). See src/sidepanel/App.test.tsx.
      - run: npm run test
      - run: npm run build
      # Fails on any REQUIRED WCAG contrast regression in the design tokens (Step 2.5).
      - run: npm run check:contrast
